name: Refresh benchmarks

# Re-reads the public image-model leaderboards weekly and lets the decision rule in
# skills/unrendered/scripts/model_select.py update the bundled registry and the README model table.
# Installs pick up the new seed data with the next update; local state stays authoritative if newer.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch leaderboards and decide
        env:
          UNRENDERED_HOME: skills/unrendered
        run: |
          set +e
          python skills/unrendered/scripts/model_select.py refresh | tee refresh.log
          code=${PIPESTATUS[0]}
          {
            echo "### Benchmark refresh"
            echo '```'
            cat refresh.log
            echo '```'
            if [ "$code" = "10" ]; then echo "Some leaderboards could not be read automatically; selection unchanged for those tracks."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f refresh.log
          exit 0
      - name: Update README model table
        run: python tools/update_readme.py
      - name: Commit updated registry and README
        run: |
          if git diff --quiet -- skills/unrendered README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/unrendered/models.json skills/unrendered/benchmarks README.md
          git commit -m "chore(benchmarks): refresh leaderboard snapshots"
          git push
