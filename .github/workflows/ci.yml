name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile scripts
        run: python -m py_compile skills/unrendered/scripts/*.py tools/*.py
      - name: Validate JSON manifests and data
        run: |
          python - <<'EOF'
          import json, pathlib
          files = [*pathlib.Path(".claude-plugin").glob("*.json"),
                   *pathlib.Path("skills/unrendered").rglob("*.json")]
          for f in files:
              json.loads(f.read_text())
          print(f"{len(files)} JSON files OK")
          EOF
      - name: Unit tests (offline)
        working-directory: tests
        run: python -m unittest -v
      - name: Check Markdown links
        run: python tools/check_links.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - name: Build website and check links
        run: python website/build.py --out _site --check-links

  min-python:
    name: Minimum Python version (3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install vermin==1.9.2
      - name: Code must run on Python 3.9+
        run: vermin -q --no-tips --violations --target=3.9- skills/unrendered/scripts tests tools
